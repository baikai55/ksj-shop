<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>号卡优选 | 订单查询</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="order">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-badge">卡</div>
        <div data-site-name>号卡优选</div>
      </div>
      <nav class="nav">
        <a href="/">商品列表</a>
        <a href="/order.html">订单查询</a>
      </nav>
    </div>
  </header>

  <main class="container" style="padding:24px 0 48px; max-width:720px">
    <section class="hero">
      <h1>订单查询</h1>
      <p>输入下单成功后的订单号查询进度。若需返回佣金信息，请在服务端配置 KSJ_API_KEY。</p>
    </section>
    <div id="page-alert" class="alert" hidden></div>
    <div class="panel">
      <form id="query-form" class="form">
        <div class="field">
          <label for="order_no">订单号</label>
          <input id="order_no" required placeholder="例如 order2026..." />
        </div>
        <button class="btn btn-primary" type="submit">查询</button>
      </form>
    </div>
    <div id="query-result" style="margin-top:16px"></div>
  </main>

  <footer class="footer">
    <div class="container">订单状态以卡世界平台为准，建议 5-10 秒间隔刷新查询。</div>
  </footer>
  <script src="/js/app.js"></script>
</body>
</html>
