<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>号卡优选 | 商品详情</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="product">
  <header class="topbar">
    <div class="container topbar-inner">
      <div class="brand">
        <div class="brand-badge">卡</div>
        <div data-site-name>号卡优选</div>
      </div>
      <nav class="nav">
        <a href="/">返回列表</a>
        <a href="/order.html">订单查询</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="page-alert" class="alert" hidden></div>
    <div class="detail-layout">
      <section class="panel">
        <img id="cover" class="detail-cover" alt="商品图" />
        <h2 id="title" style="margin-top:14px">加载中…</h2>
        <div id="meta" class="meta" style="margin:8px 0"></div>
        <div id="tags" class="tags"></div>
        <div id="detail-html" class="detail-html"></div>
      </section>

      <section class="panel">
        <h2>在线办理</h2>
        <p class="meta">信息仅用于开卡审核与物流配送，请如实填写。</p>
        <form id="order-form" class="form" style="margin-top:12px">
          <div class="field">
            <label for="consignee">收货人姓名</label>
            <input id="consignee" name="consignee" required maxlength="30" placeholder="请输入真实姓名" />
          </div>
          <div class="field">
            <label for="phone">联系电话</label>
            <input id="phone" name="phone" required maxlength="20" placeholder="用于联系与接收物流短信" />
          </div>
          <div class="field" id="field-idcard" hidden>
            <label for="id_card_no">身份证号 <span class="hint">（该商品要求实名）</span></label>
            <input id="id_card_no" name="id_card_no" maxlength="18" placeholder="请输入身份证号" />
          </div>
          <div class="field">
            <label>收货地区</label>
            <div class="row-3">
              <select id="province" required></select>
              <select id="city" required></select>
              <select id="district" required></select>
            </div>
          </div>
          <div class="field">
            <label for="address">详细地址</label>
            <textarea id="address" name="address" rows="3" required minlength="5" placeholder="街道门牌等，不少于5个字"></textarea>
          </div>

          <div id="phone-pick-wrap" hidden>
            <div class="field">
              <label>选择号码</label>
              <div class="toolbar" style="margin:0">
                <input id="phone_keyword" type="search" placeholder="可选：号码关键字" />
                <button id="btn-load-phone" class="btn" type="button">刷新号码</button>
              </div>
              <input type="hidden" id="option_phone" />
              <div id="phone-list" class="phone-list" style="margin-top:8px"></div>
            </div>
          </div>

          <label class="checkbox-line">
            <input id="agree" type="checkbox" />
            <span>我已阅读并同意入网/服务相关协议，确认信息真实有效。</span>
          </label>

          <button id="btn-submit" class="btn btn-primary" type="submit" style="width:100%;padding:12px">提交办理</button>
          <div id="order-result" class="alert" hidden></div>
          <div id="order-no-box" class="notice" hidden></div>
        </form>
      </section>
    </div>
  </main>

  <footer class="footer">
    <div class="container">提交后订单将通过卡世界官方 API 自动创建，可凭订单号查询状态。</div>
  </footer>
  <script src="/js/app.js"></script>
</body>
</html>
